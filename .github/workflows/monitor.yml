name: Bridge Check

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # This ensures the bot has permission to save files to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install opencv-python-headless numpy yt-dlp

      - name: Run Monitor Script
        run: python monitor.py

      - name: Commit and Push Status
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the status.json file created by monitor.py
          git add status.json
          
          # Commit only if there are changes
          git commit -m "Update bridge status" || exit 0
          
          # Pull any manual web edits you made to avoid the 'rejected' error
          # We use origin master because your logs showed 'master'
          git pull --rebase origin master
          
          # Push the final result
          git push origin master
