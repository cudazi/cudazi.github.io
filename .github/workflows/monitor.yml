name: Bridge Check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Updated version
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated version
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install opencv-python-headless numpy yt-dlp
      - name: Run Monitor
        run: python monitor.py
      - name: Commit Status
        run: |
          git config --global user.name 'BridgeBot'
          git config --global user.email 'bot@bridge.com'
          git add status.json
          git commit -m "Bridge Update: $(date)" || exit 0
          git push
